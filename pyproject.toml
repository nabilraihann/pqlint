[project]
name = "pqlint"
version = "0.1.0"
description = "Lint Parquet files using only their footer metadata"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pyarrow>=26.0.0",
]

[project.scripts]
pqlint = "pqlint.cli:main"

[build-system]
requires = ["uv_build>=0.9.25,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
